<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body onload="myfunction()">
    <h1>Shopping Portal</h1>
    <div id="Project"></div>
    <style>
        #Project {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
    padding: 30px;
}
body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #172554, #312e81);
    color: #f8fafc;
    font-family: "Trebuchet MS", Arial, sans-serif;
}

h1 {
    text-align: center;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #f8fafc;
    text-shadow: 0 0 20px rgba(129, 140, 248, 0.8);
    margin: 30px 0;
}

.card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    transition: 0.3s;
}

.card h2 {
    font-size: 19px;
    color: #e0e7ff;
    line-height: 1.4;
}

.card p {
    color: #cbd5e1;
    line-height: 1.6;
}

.card h2:nth-of-type(2) {
    color: #67e8f9;
    font-size: 25px;
    font-weight: bold;
}

.card button {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.card button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.7);
}



    .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    transition: 0.3s;
}
   .card p {
    height: 70px;
    overflow: hidden;
    color: #ddd;
}

    .card:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
}
    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #282e3e, #6560a1,rgb(161, 90, 90));
        color:black (176, 63, 63);
        font-family: Arial, sans-serif;
    }
      
      .card img {
     width: 120px;
     height: 150px;
     object-fit: contain;
     transition: 0.3s;
}

    .card:hover img {
    transform: scale(1.09);
}
    h1 {
        text-align: center;
        font-size: 45px;
        color:white;
        text-shadow: 0 0 15px rgb(203, 162, 162);
        margin-top: 30px;
    }

    #Project {
        padding: 30px;
        
        .card img {
    width: 200px;
    height: 150px;
    object-fit: contain;
    .card h2:nth-of-type(2) {
    color: #5eead4;
    font-size: 24px;
}
    .card button {
    background: #6366f1;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.card button:hover {
    background: #8b5cf6;
    transform: scale(1.05);
    }
}
   
    }
    </style>
    <script>
        async function myfunction() {

    let news = [];

    await fetch("https://fakestoreapi.com/products")
        .then(response => response.json())
        .then(data => {
            news = data;
            console.log(news);
        })
        .catch(error => {
            console.log("Error:", error);
        });

    let newsBox = document.getElementById("Project");

    for (let i = 0; i < news.length; i++) {

        newsBox.innerHTML += `
            <div class="card">

                <img src="${news[i].image}">

                <div class="card-content">

                    <h2>${news[i].title}</h2>
                    <h2>$${news[i].price}</h2>
                    <p>${news[i].description}</p>

                    <button onclick="readMore('${news[i].id}')">
                        Read More
                    </button>

                </div>

            </div>
        `;
    }
}
    </script>
</body>
</html>
